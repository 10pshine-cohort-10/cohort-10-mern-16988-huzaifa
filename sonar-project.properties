sonar.projectKey=shine-notes
sonar.projectName=Shine Notes
sonar.sources=server/src,client/src
sonar.tests=server/test,client/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=client/src/__tests__/**,client/src/test-setup.ts,client/src/style-mock.cjs
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.coverage.exclusions=server/src/index.ts,server/src/migrate.ts,client/src/main.tsx,client/src/types.ts
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
