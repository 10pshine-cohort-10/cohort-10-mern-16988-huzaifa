name: SonarQube analysis
on:
  push:
    branches: [assignment]
    paths:
      - 'server/**'
      - 'client/**'
      - 'scripts/sonar-ci.mjs'
      - 'sonar-project.properties'
      - '.github/workflows/sonar.yml'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: node scripts/sonar-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-analysis
          path: sonar-results
